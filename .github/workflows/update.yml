name: Actualizar y Validar Subdominios

on:
  schedule:
    - cron: '0 0 1 * *' # Primer dia de cada mes
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Instalar Subfinder y Httpx
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest

      - name: Dar permisos y ejecutar el script de escaneo
        run: |
          chmod +x scripts/scan.sh
          export PATH=$PATH:$(go env GOPATH)/bin
          bash scripts/scan.sh

      - name: Obtener fecha actual
        id: date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Actualizar cambios en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[${{ env.CURRENT_DATE }}] Automatic data update"
          file_pattern: "data/*.txt README.md"
